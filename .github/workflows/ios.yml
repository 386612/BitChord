name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/ios.yml'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build KMP iOS frameworks
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :sharedUi:linkDebugFrameworkIosSimulatorArm64
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project iosApp/BitChordIOS.xcodeproj \
            -scheme BitChordIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/BitChordIOS.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../../BitChord-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-ios-unsigned
          path: BitChord-ios-unsigned.ipa
